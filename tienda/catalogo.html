<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo · {negocio}</title>
<meta name="description" content="Explora todos los productos por categoría, precio y novedades.">
<meta name="theme-color" content="#1e3a5f">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=optional" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header class="encabezado" id="encabezado"></header>
<main class="contenedor seccion">
  <div class="seccion-cabecera"><div><h1 id="titulo-catalogo">Catálogo</h1><p id="sub-catalogo"></p></div></div>
  <div class="chips" id="chips"></div>
  <div class="catalogo-layout">
    <aside class="filtros" id="filtros" aria-label="Filtros">
      <h3>Categoría</h3><div id="f-categorias"></div>
      <h3>Precio (COP)</h3><div class="rango"><input type="number" id="f-min" placeholder="Mín" min="0" inputmode="numeric"><span>–</span><input type="number" id="f-max" placeholder="Máx" min="0" inputmode="numeric"></div>
      <h3>Mostrar</h3>
      <label><input type="checkbox" id="f-nuevos"> Solo novedades</label>
      <label><input type="checkbox" id="f-ofertas"> Solo ofertas</label>
      <label><input type="checkbox" id="f-disponibles"> Solo disponibles</label>
      <button class="btn btn-suave btn-sm btn-bloque" id="f-limpiar" style="margin-top:.8rem">Limpiar filtros</button>
    </aside>
    <div>
      <div class="barra-resultados">
        <span id="conteo" style="color:var(--texto-suave)"></span>
        <div style="display:flex;gap:.5rem">
          <button class="btn btn-suave btn-sm btn-filtros" id="btn-filtros">Filtros</button>
          <label class="visualmente-oculto" for="orden">Ordenar</label>
          <select id="orden">
            <option value="relevancia">Relevancia</option>
            <option value="precio-asc">Precio: menor a mayor</option>
            <option value="precio-desc">Precio: mayor a menor</option>
            <option value="nuevos">Más recientes</option>
            <option value="nombre">Nombre A–Z</option>
          </select>
        </div>
      </div>
      <div class="grid-productos" id="grid"></div>
    </div>
  </div>
</main>
<footer class="pie" id="pie"></footer>
<script src="js/app.js"></script>
<script src="js/catalogo.js"></script>
</body>
</html>
