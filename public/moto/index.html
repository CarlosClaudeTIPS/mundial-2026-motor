<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MotoLog">
<meta name="description" content="Mantenimiento, historial, combustible y lecciones para una Suzuki Gixxer 155 FI ABS 2024.">
<title>MotoLog · Gixxer 155</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏍️</text></svg>">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#ffffff;--bg2:#f6f8fb;--bg3:#e9eef5;--border:#dfe5ee;--text:#1c2434;--text2:#5b6678;--text3:#8c96a8;--accent:#1f6fe0;--accent2:#e8f0fd;--green:#13945f;--gbg:#e1f5ea;--amber:#d4830a;--abg:#fdf0d8;--red:#d93f38;--rbg:#fde6e4;--r:14px;--shadow:0 1px 2px rgba(20,30,50,.05),0 6px 18px rgba(20,30,50,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{background:var(--bg);color:var(--text);font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--bg);border-bottom:1px solid var(--border);padding:10px 16px;position:sticky;top:0;z-index:100;padding-top:calc(10px + env(safe-area-inset-top));box-shadow:0 2px 10px rgba(20,30,50,.05)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1000px;margin:0 auto}
.logo{font-size:18px;font-weight:800;color:var(--accent);white-space:nowrap;letter-spacing:-.2px}
.logo small{color:var(--text2);font-weight:600;font-size:12px;margin-left:6px}
.kmbadge{font-size:13px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);padding:5px 12px;border-radius:99px;white-space:nowrap;cursor:pointer;font-weight:600}
.kmbadge b{color:var(--text)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;max-width:1000px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;padding:7px 14px;background:var(--bg2);border:1px solid transparent;border-radius:99px;color:var(--text2);cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:all .15s;position:relative}
nav button.active{background:var(--accent);color:#fff}
nav button:hover:not(.active){background:var(--bg3);color:var(--text)}
nav button .dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid #fff}
main{max-width:1000px;margin:0 auto;padding:18px 16px 40px}
.panel{display:none}.panel.active{display:block}
h2{font-size:22px;font-weight:800;margin-bottom:12px;letter-spacing:-.3px;text-wrap:balance}
h3{font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin:22px 0 10px;font-weight:800}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.ok{border-left:5px solid var(--green)}.card.soon{border-left:5px solid var(--amber)}.card.due{border-left:5px solid var(--red)}.card.none{border-left:5px solid var(--text3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.grid .card{margin:0}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.row>div:first-child{flex:1;min-width:0}
.row .badge,.row .btn{flex:0 0 auto}
.muted{color:var(--text2);font-size:13px}
.tiny{color:var(--text3);font-size:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.badge.ok{background:var(--gbg);color:var(--green)}.badge.soon{background:var(--abg);color:var(--amber)}.badge.due{background:var(--rbg);color:var(--red)}.badge.none{background:var(--bg3);color:var(--text2)}.badge.blue{background:var(--accent2);color:var(--accent)}
.btn{padding:9px 16px;border-radius:99px;border:1px solid var(--border);background:#fff;color:var(--text);cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;transition:all .15s}
.btn:hover{background:var(--bg2);border-color:#c9d2e0}
.btn:focus-visible,nav button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent2);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1a5fc2}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.link{background:transparent;border:none;color:var(--accent);padding:4px 0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{background:var(--bg2);border-radius:var(--r);padding:14px 10px;text-align:center}
.stat .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}.stat .l{font-size:12px;color:var(--text2);margin-top:2px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.bar{height:8px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar.soon i{background:var(--amber)}.bar.due i{background:var(--red)}
label{display:block;font-size:13px;color:var(--text2);margin-bottom:12px;font-weight:700}
input,select,textarea{width:100%;margin-top:5px;padding:10px 12px;background:#fff;border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:16px;font-family:inherit;font-weight:600}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
textarea{min-height:70px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:flex-start;gap:12px;padding:14px;background:#fff;border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.check input{width:24px;height:24px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--green)}
.check.done{opacity:.55}
.check b{display:block;font-size:15px}
.check span{font-size:13px;color:var(--text2);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--text2);font-size:12px;text-transform:uppercase;font-weight:800;letter-spacing:.3px}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.empty{text-align:center;padding:36px 12px;color:var(--text2)}
.empty .big{font-size:40px;margin-bottom:8px}
.lesson{cursor:pointer;display:flex;gap:12px;align-items:center}
.lesson:hover{border-color:var(--accent)}
.lesson.read{opacity:.8}
.lesson .thumb{width:64px;height:48px;flex:0 0 auto;background:var(--bg2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px}
.lessonbody h4{margin:18px 0 6px;font-size:16px;color:var(--accent);font-weight:800}
.lessonbody p{margin-bottom:10px;max-width:68ch}
.lessonbody ul,.lessonbody ol{margin:0 0 10px 20px;max-width:68ch}
.lessonbody li{margin-bottom:5px}
.lessonbody .note{background:var(--accent2);border-left:4px solid var(--accent);padding:10px 14px;border-radius:8px;margin:12px 0;font-size:14px}
.lessonbody .warn{background:var(--abg);border-left:4px solid var(--amber);padding:10px 14px;border-radius:8px;margin:12px 0;font-size:14px}
.lessonbody figure{margin:12px 0;background:var(--bg2);border-radius:12px;padding:10px}
.lessonbody figure svg{display:block;width:100%;max-width:360px;height:auto;margin:0 auto}
.lessonbody figcaption{font-size:12px;color:var(--text2);text-align:center;margin-top:6px;font-weight:600}
.quiz .opt{display:block;width:100%;text-align:left;padding:11px 14px;margin-bottom:8px;background:#fff;border:1.5px solid var(--border);border-radius:12px;color:var(--text);cursor:pointer;font-size:15px;font-family:inherit;font-weight:600}
.quiz .opt.right{border-color:var(--green);background:var(--gbg)}
.quiz .opt.wrong{border-color:var(--red);background:var(--rbg)}
.quiz .opt:disabled{cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:#fff;color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;font-weight:700}
.tabs button.active{background:var(--text);color:#fff;border-color:var(--text)}
.modalbg{display:none;position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:200;align-items:flex-end;justify-content:center}
.modalbg.open{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(20,30,50,.2)}
@media(min-width:600px){.modalbg{align-items:center}.modal{border-radius:20px}}
.modal h2{display:flex;justify-content:space-between;align-items:center;font-size:19px}
.modal .x{background:var(--bg2);border:none;color:var(--text2);font-size:20px;cursor:pointer;width:34px;height:34px;border-radius:50%}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300;white-space:nowrap;box-shadow:var(--shadow)}
#toast.show{opacity:1}
.tipbox{background:linear-gradient(135deg,#e8f0fd,#f3f7fe);border:1px solid #cfe0fa;border-radius:var(--r);padding:16px;margin-bottom:14px}
.tipbox .t{font-size:12px;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
/* Ilustraciones */
.illus{width:100%;height:auto;display:block}
.illus .ln{stroke:#3f4a5c;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.illus .fl{fill:#e9eef5}
.illus .wh{fill:#fff}
.illus .ac{fill:var(--accent)}
.illus .acl{stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.illus .ok{fill:var(--green)}
.illus .bad{fill:var(--red)}
.illus .oil{fill:#f2b632}
.illus .lb{font-size:9px;fill:#3f4a5c;font-family:inherit;font-weight:700}
.illus .lba{font-size:9px;fill:var(--accent);font-family:inherit;font-weight:800}
.illus .num{font-size:9px;fill:#fff;font-family:inherit;font-weight:800;text-anchor:middle}
.itemcard{display:flex;gap:14px;align-items:flex-start}
.itemcard .pic{width:88px;flex:0 0 auto;background:var(--bg2);border-radius:12px;padding:6px;cursor:pointer;overflow:hidden}
.itemcard .pic img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
.photo{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:12px}
.photocap{font-size:12px;color:var(--text2);font-weight:700;margin:6px 0 10px}
.bikephoto{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:10px}
.itemcard .body{flex:1;min-width:0}
.sheet .pic{background:var(--bg2);border-radius:14px;padding:10px;margin:8px 0 14px}
.sheet .pic svg{max-width:320px;margin:0 auto}
.sheet h4{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin:14px 0 4px}
.sheet p{margin-bottom:6px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 14px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-style:normal;font-size:11px;font-weight:800;flex:0 0 auto}
.mapwrap{background:var(--bg2);border-radius:12px;padding:8px}
.mapwrap svg{max-width:560px;margin:0 auto;display:block}
kbd{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo">🏍️ MotoLog <small id="hdrBike"></small></div>
    <div class="kmbadge" onclick="updateKm()">📍 <b id="hdrKm">0 km</b> · actualizar</div>
  </div>
  <nav id="nav">
    <button data-p="home">Inicio</button>
    <button data-p="maint">Mantenimiento</button>
    <button data-p="history">Historial</button>
    <button data-p="fuel">Combustible</button>
    <button data-p="check">Checklist</button>
    <button data-p="learn">Aprender</button>
    <button data-p="settings">Ajustes</button>
  </nav>
</header>

<main>
  <section class="panel" id="p-home"></section>
  <section class="panel" id="p-maint"></section>
  <section class="panel" id="p-history"></section>
  <section class="panel" id="p-fuel"></section>
  <section class="panel" id="p-check"></section>
  <section class="panel" id="p-learn"></section>
  <section class="panel" id="p-settings"></section>
</main>

<div class="modalbg" id="modalbg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2><span id="modalTitle"></span><button class="x" onclick="closeModal()">×</button></h2>
    <form id="modalForm" onsubmit="return submitModal(event)">
      <div id="modalBody"></div>
      <div class="btnrow" id="modalBtns"></div>
    </form>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* ==================== UTILIDADES ==================== */
const KEY='motolog_v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function parseD(s){return new Date(s+'T00:00:00')}
function fmtD(s){if(!s)return '—';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function fmtKm(n){return (Number(n)||0).toLocaleString('es-ES')+' km'}
function fmtMoney(n){const c=state.settings.currency||'$';const noDec=c==='$'||/COP/i.test(c);const v=(Number(n)||0).toLocaleString('es-CO',{minimumFractionDigits:noDec?0:2,maximumFractionDigits:noDec?0:2});return c==='$'?'$ '+v:v+' '+c}
function addMonths(s,months){const d=parseD(s);const w=Math.floor(months);d.setMonth(d.getMonth()+w);d.setDate(d.getDate()+Math.round((months-w)*30.44));return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function daysUntil(s){return Math.round((parseD(s)-parseD(today()))/86400000)}
function daysAgo(s){return -daysUntil(s)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function relDays(n){if(n===0)return 'hoy';if(n===1)return 'mañana';if(n===-1)return 'ayer';if(n>0)return `en ${n} días`;return `hace ${-n} días`}

/* ==================== DATOS POR DEFECTO ==================== */
/* ==================== ILUSTRACIONES (esquemas de cada pieza) ==================== */
const SVG=(inner)=>`<svg class="illus" viewBox="0 0 160 110" role="img">${inner}</svg>`;
const ARROW=(x1,y1,x2,y2)=>`<path d="M${x1} ${y1} L${x2} ${y2}" class="acl"/><path d="M${x2-4} ${y2-6} L${x2} ${y2} L${x2+4} ${y2-6}" class="acl"/>`;
const ILLUS={
oil:SVG(`<rect x="18" y="12" width="124" height="86" rx="14" class="fl ln"/>
<circle cx="112" cy="26" r="8" class="wh ln"/><path d="M107 26 h10 M112 21 v10" class="ln"/><text x="28" y="29" class="lb">tapón de llenado</text>
<circle cx="70" cy="64" r="19" class="wh"/>
<path d="M51 64 A19 19 0 0 0 89 64 Z" class="oil"/>
<circle cx="70" cy="64" r="19" class="ln" style="fill:none"/>
<path d="M92 54 h12" class="ln"/><text x="106" y="57" class="lb">MAX</text>
<path d="M92 74 h12" class="ln"/><text x="106" y="77" class="lb">MIN</text>
<text x="50" y="98" class="lba">mirilla</text>`),
oilfilter:SVG(`<rect x="30" y="20" width="100" height="70" rx="12" class="fl ln"/>
<circle cx="80" cy="55" r="26" class="wh ln"/>
<circle cx="80" cy="55" r="18" class="ln" style="stroke-dasharray:3 3"/>
<circle cx="80" cy="55" r="7" class="fl ln"/>
<circle cx="80" cy="27" r="3" class="ac"/><circle cx="56" cy="69" r="3" class="ac"/><circle cx="104" cy="69" r="3" class="ac"/>
<text x="30" y="104" class="lb">tapa redonda con 3 tornillos</text>`),
airfilter:SVG(`<rect x="22" y="22" width="116" height="66" rx="8" class="wh ln"/>
<path d="M30 30 l8 50 l8 -50 l8 50 l8 -50 l8 50 l8 -50 l8 50 l8 -50 l8 50 l8 -50 l8 50 l8 -50" class="ln"/>
<path d="M34 16 q6 -8 12 0 M60 12 q6 -8 12 0" class="ln"/>${ARROW(70,-2,70,12)}
<text x="50" y="104" class="lb">elemento plisado: limpio = claro</text>`),
plugs:SVG(`<rect x="70" y="10" width="20" height="14" rx="3" class="fl ln"/>
<rect x="66" y="24" width="28" height="34" rx="6" class="wh ln"/>
<path d="M70 32 h20 M70 40 h20 M70 48 h20" class="ln"/>
<rect x="60" y="58" width="40" height="16" rx="3" class="fl ln"/>
<rect x="72" y="74" width="16" height="14" class="fl ln"/>
<path d="M80 88 v8" class="ln"/><path d="M72 100 h12 l0 -4" class="ln"/>
<text x="100" y="100" class="lba">0,8-0,9 mm</text>
<text x="10" y="20" class="lb">NGK</text><text x="10" y="31" class="lb">CPR8EA-9</text>`),
valves:SVG(`<rect x="30" y="50" width="100" height="44" rx="6" class="fl ln"/>
<circle cx="80" cy="34" r="14" class="wh ln"/><path d="M80 20 q12 10 0 28" class="ln"/>
<path d="M80 48 v10" class="ln"/><rect x="72" y="58" width="16" height="6" class="ln wh"/><path d="M80 64 v22" class="ln"/><path d="M68 86 h24" class="ln" style="stroke-width:4"/>
<rect x="96" y="50" width="30" height="4" class="ac"/><text x="100" y="47" class="lba">galga</text>
<text x="36" y="104" class="lb">holgura leva-válvula · taller</text>`),
chainlube:SVG(`<circle cx="30" cy="60" r="14" class="fl ln"/><circle cx="130" cy="60" r="26" class="fl ln"/>
<path d="M30 46 Q80 40 130 34" class="ln" style="stroke-width:5"/><path d="M30 74 Q80 88 130 86" class="ln" style="stroke-width:5"/>
<rect x="56" y="8" width="14" height="26" rx="3" class="ac"/><rect x="59" y="4" width="8" height="6" class="ac"/>

<text x="76" y="20" class="lb">spray en la parte</text><text x="76" y="30" class="lb">interior, rueda girando</text>`),

<path d="M30 38 Q80 32 130 26" class="ln" style="stroke-width:5"/>
<path d="M30 66 Q80 96 130 78" class="ln" style="stroke-width:5"/>
<path d="M80 60 v22" class="acl" style="stroke-dasharray:3 3"/>
${ARROW(80,60,80,80)}<text x="86" y="74" class="lba">20-30 mm</text>
<text x="44" y="104" class="lb">empuja arriba y abajo </text>`),
chainkit:SVG(`<circle cx="45" cy="55" r="26" class="fl ln"/>
<path d="M45 29 l4 -6 l4 6 M45 81 l4 6 l4 -6 M19 55 l-6 4 l6 4 M71 55 l6 4 l6 4" class="ln" style="stroke-width:2"/>
<text x="32" y="98" class="lb">dientes rectos</text><circle cx="45" cy="55" r="5" class="ok"/>
<circle cx="118" cy="55" r="26" class="fl ln"/>
<path d="M118 29 l10 -8 l-2 8 M118 81 l10 8 l-2 -8 M92 55 l-8 -10 l8 2 M144 55 l8 10 l-8 -2" class="ln" style="stroke-width:2"/>
<text x="86" y="98" class="lb">aleta de tiburón</text><circle cx="118" cy="55" r="5" class="bad"/>`),
pads:SVG(`<path d="M20 20 h120" class="ln" style="stroke-width:10;stroke:#c9d2e0"/><text x="22" y="12" class="lb">disco</text>

async function loadPhotos(){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('photos').objectStore('photos');const req=t.openCursor();req.onsuccess=()=>{const c=req.result;if(c){photos[c.key]=c.value;c.continue()}else res()};req.onerror=()=>rej(req.error)})}catch(e){}}
async function setPhoto(id,data){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('photos','readwrite');if(data)t.objectStore('photos').put(data,id);else t.objectStore('photos').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)});if(data)photos[id]=data;else delete photos[id];return true}catch(e){toast('No se pudo guardar la foto');return false}}
function pickPhoto(id,after,fromGallery){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';if(!fromGallery)inp.setAttribute('capture','environment');
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const img=new Image();const url=URL.createObjectURL(f);
    img.onload=async()=>{const MAX=1200;let w=img.width,h=img.height;const k=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      const data=c.toDataURL('image/jpeg',.82);if(await setPhoto(id,data)){toast('Foto guardada');after&&after()}};
    img.onerror=()=>{URL.revokeObjectURL(url);toast('No se pudo leer la imagen')};img.src=url};
  inp.click();
}
async function removePhoto(id,after){if(confirm('¿Quitar esta foto?')){await setPhoto(id,null);toast('Foto quitada');after&&after()}}

/* ==================== ESTADO ==================== */
function freshState(){return {v:1,plan:PLAN_VERSION,bike:{name:'Mi Gixxer',brand:BIKE.brand,model:BIKE.model,year:BIKE.year,plate:'',km:0,notes:''},items:JSON.parse(JSON.stringify(DEFAULT_ITEMS)),logs:[],fuel:[],checklist:{date:'',done:[]},learn:{read:[],quiz:{}},settings:{currency:'$'},createdAt:today()}}
let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1){const f=freshState();const st=Object.assign(f,s,{bike:Object.assign(f.bike,s.bike),settings:Object.assign(f.settings,s.settings),learn:Object.assign(f.learn,s.learn),checklist:Object.assign(f.checklist,s.checklist)});st.plan=s.plan||null;return migrate(st)}}catch(e){}return freshState()}
// Actualiza un estado guardado con una versión anterior del plan al plan de la Gixxer, conservando historial y puntos personalizados.
function migrate(st){
  if(st.plan===PLAN_VERSION)return st;
  const fromGixxer=/^gixxer155/.test(st.plan||'');
  const custom=st.items.filter(i=>!DEFAULT_ITEMS.some(d=>d.id===i.id)&&i.id!=='coolant'&&i.id!=='itv');
  const hasLogs=id=>st.logs.some(l=>l.itemId===id);
  const legacy=st.items.filter(i=>(i.id==='coolant'||i.id==='itv')&&hasLogs(i.id));
  st.logs.forEach(l=>{if(l.itemId==='itv')l.itemId='rtm'});
  const defaults=JSON.parse(JSON.stringify(DEFAULT_ITEMS)).map(d=>{const old=fromGixxer&&st.items.find(i=>i.id===d.id);return old?Object.assign(d,{km:old.km,months:old.months}):d});
  st.items=[...defaults,...custom,...legacy.filter(i=>i.id==='coolant')];
  if(!st.bike.brand&&!st.bike.model){st.bike.brand=BIKE.brand;st.bike.model=BIKE.model;st.bike.year=BIKE.year;if(!st.bike.name)st.bike.name='Mi Gixxer'}
  if(st.settings.currency==='€')st.settings.currency='$';
  st.plan=PLAN_VERSION;
  try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}
  return st;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('No se pudo guardar (almacenamiento lleno o bloqueado)')}}

/* ==================== LÓGICA DE MANTENIMIENTO ==================== */
function lastLog(itemId){return state.logs.filter(l=>l.itemId===itemId).sort((a,b)=>(b.km-a.km)||(b.date<a.date?-1:1))[0]}
function itemStatus(it){
  const last=lastLog(it.id);
  if(!last)return {code:'none',label:'Sin registro',last:null,kmLeft:null,daysLeft:null,dueKm:null,dueDate:null,pct:0};
  const cur=Number(state.bike.km)||0;
  const r={code:'ok',last,kmLeft:null,daysLeft:null,dueKm:null,dueDate:null,pct:0};
  let pct=0;
  if(it.km){r.dueKm=Number(last.km)+Number(it.km);r.kmLeft=r.dueKm-cur;pct=Math.max(pct,(cur-last.km)/it.km)}
  if(it.months){r.dueDate=addMonths(last.date,it.months);r.daysLeft=daysUntil(r.dueDate);pct=Math.max(pct,daysAgo(last.date)/(it.months*30.44))}
  r.pct=Math.min(1,Math.max(0,pct));
  const kmSoon=it.km?Math.min(500,Math.max(100,it.km*0.1)):0;
  const daySoon=it.months?Math.min(30,Math.max(2,Math.round(it.months*30*0.15))):0;
  if((r.kmLeft!==null&&r.kmLeft<0)||(r.daysLeft!==null&&r.daysLeft<0))r.code='due';
  else if((r.kmLeft!==null&&r.kmLeft<=kmSoon)||(r.daysLeft!==null&&r.daysLeft<=daySoon))r.code='soon';
  r.label={ok:'Al día',soon:'Pronto',due:'Vencido'}[r.code];
  return r;
}
function statusText(st){
  const parts=[];
  if(st.kmLeft!==null)parts.push(st.kmLeft<0?`pasado por ${fmtKm(-st.kmLeft)}`:`faltan ${fmtKm(st.kmLeft)}`);
  if(st.daysLeft!==null)parts.push(st.daysLeft<0?`vencido ${relDays(st.daysLeft)}`:relDays(st.daysLeft));
  return parts.join(' · ');
}
function sortedItems(){
  const order={due:0,soon:1,ok:2,none:3};
  return state.items.map(it=>({it,st:itemStatus(it)})).sort((a,b)=>(order[a.st.code]-order[b.st.code])||(b.st.pct-a.st.pct)||a.it.name.localeCompare(b.it.name));
}
function intervalText(it){const p=[];if(it.km)p.push(`cada ${fmtKm(it.km)}`);if(it.months)p.push(it.months<1?`cada ${Math.round(it.months*30)} días`:`cada ${it.months} ${it.months===1?'mes':'meses'}`);return p.join(' o ')||'sin intervalo'}

function addLog(itemId,editId){

  const sel=log?log.itemId:(itemId||'');
  openModal(editId?'Editar intervención':'Registrar intervención',`
    <label>Punto de mantenimiento<select name="itemId"><option value="">— Otro (describir abajo) —</option>${state.items.map(i=>`<option value="${i.id}" ${i.id===sel?'selected':''}>${esc(i.name)}</option>`).join('')}</select></label>
    <label>Descripción <span class="tiny">(si es "Otro", o para detallar)</span><input name="title" value="${esc(log?.title||'')}" placeholder="Ej. Cambio de bombilla trasera"></label>
    <div class="frow"><label>Fecha<input name="date" type="date" required value="${log?log.date:today()}"></label>
    <label>Kilómetros<input name="km" type="number" min="0" required value="${log?log.km:state.bike.km}"></label></div>
    <div class="frow"><label>Coste (${esc(state.settings.currency)})<input name="cost" type="number" min="0" step="0.01" value="${log?.cost??''}"></label>
    <label>Dónde<input name="place" value="${esc(log?.place||'')}" placeholder="Taller / yo mismo"></label></div>
    <label>Notas<textarea name="notes" placeholder="Marca de aceite, referencias de piezas, observaciones...">${esc(log?.notes||'')}</textarea></label>`,
    d=>{
      if(!d.itemId&&!d.title.trim()){toast('Elige un punto o escribe una descripción');return false}
      const o={itemId:d.itemId||null,title:d.title.trim(),date:d.date,km:Number(d.km),cost:Number(d.cost)||0,place:d.place.trim(),notes:d.notes.trim()};
      if(log)Object.assign(log,o);else state.logs.push(Object.assign({id:uid()},o));
      if(o.km>Number(state.bike.km))state.bike.km=o.km;
      save();render();toast('Intervención guardada');
    },editId?[{label:'Eliminar',cls:'danger',fn:()=>{if(confirm('¿Eliminar esta intervención?')){state.logs=state.logs.filter(l=>l.id!==editId);save();closeModal();render()}}}]:[]);
}
function bulkInit(){
  const none=state.items.filter(i=>!lastLog(i.id));
  openModal('Marcar como hechos',`<p class="muted" style="margin-bottom:10px">Se creará un registro para los ${none.length} puntos sin historial. Útil si acabas de hacer una revisión completa o quieres empezar a contar desde hoy.</p>
    <div class="frow"><label>Fecha<input name="date" type="date" value="${today()}" required></label><label>Kilómetros<input name="km" type="number" min="0" value="${state.bike.km}" required></label></div>`,
    d=>{none.forEach(i=>state.logs.push({id:uid(),itemId:i.id,title:'',date:d.date,km:Number(d.km),cost:0,place:'',notes:'Registro inicial'}));if(Number(d.km)>state.bike.km)state.bike.km=Number(d.km);save();render();toast(`${none.length} puntos registrados`)});
}
function updateKm(){
  openModal('Actualizar kilómetros',`<label>Kilómetros actuales del cuentakilómetros<input name="km" type="number" min="0" required value="${state.bike.km}" autofocus></label>`,

/* ==================== HISTORIAL ==================== */
function renderHistory(){
  const el=$('#p-history');
  const logs=[...state.logs].sort((a,b)=>(b.date<a.date?-1:b.date>a.date?1:0)||(b.km-a.km));
  const total=logs.reduce((s,l)=>s+(Number(l.cost)||0),0);
  const yr=today().slice(0,4);const totalYr=logs.filter(l=>l.date.startsWith(yr)).reduce((s,l)=>s+(Number(l.cost)||0),0);
  let h=`<div class="row"><h2>Historial</h2><button class="btn sm primary" onclick="addLog()">＋ Registrar</button></div>
  <div class="stats"><div class="stat"><div class="v">${logs.length}</div><div class="l">Intervenciones</div></div><div class="stat"><div class="v">${fmtMoney(totalYr)}</div><div class="l">Gasto en ${yr}</div></div><div class="stat"><div class="v">${fmtMoney(total)}</div><div class="l">Gasto total</div></div></div>`;
  if(!logs.length)h+='<div class="empty"><div class="big">📒</div>Aún no hay intervenciones registradas.<br><span class="tiny">Registra cambios de aceite, revisiones, reparaciones... con sus km y coste.</span></div>';
  h+=logs.map(l=>{const it=state.items.find(i=>i.id===l.itemId);return `<div class="card" style="cursor:pointer" onclick="addLog(null,'${l.id}')"><div class="row"><div><b>${esc(it?it.name:l.title||'Intervención')}</b>${it&&l.title?`<div class="muted">${esc(l.title)}</div>`:''}<div class="muted">${fmtD(l.date)} · ${fmtKm(l.km)}${l.place?' · '+esc(l.place):''}</div>${l.notes?`<div class="tiny">${esc(l.notes)}</div>`:''}</div><div style="text-align:right"><b>${l.cost?fmtMoney(l.cost):''}</b></div></div></div>`}).join('');
  el.innerHTML=h;
}

/* ==================== COMBUSTIBLE ==================== */
function fuelStats(){
  const f=[...state.fuel].sort((a,b)=>a.km-b.km);
  const cons=[];
  for(let i=1;i<f.length;i++){if(f[i].full&&f[i].km>f[i-1].km){cons.push({l100:f[i].liters/(f[i].km-f[i-1].km)*100,km:f[i].km})}}
  const avg=cons.length?cons.reduce((s,c)=>s+c.l100,0)/cons.length:null;
  const last=cons.length?cons[cons.length-1].l100:null;
  const totalCost=f.reduce((s,x)=>s+(Number(x.cost)||0),0),totalL=f.reduce((s,x)=>s+(Number(x.liters)||0),0);
  const dist=f.length>1?f[f.length-1].km-f[0].km:0;
  return {avg,last,totalCost,totalL,dist,costKm:dist>0?totalCost/dist:null,priceL:totalL>0?totalCost/totalL:null};
}
function renderFuel(){
  const el=$('#p-fuel');const s=fuelStats();
  const list=[...state.fuel].sort((a,b)=>b.km-a.km);
  let h=`<div class="row"><h2>Combustible</h2><button class="btn sm primary" onclick="addFuel()">＋ Tanqueada</button></div>
  <div class="stats">
    <div class="stat"><div class="v">${s.avg?s.avg.toFixed(2):'—'}</div><div class="l">L/100 km medio</div></div>
    <div class="stat"><div class="v">${s.avg?(100/s.avg).toFixed(1):'—'}</div><div class="l">km por litro</div></div>
    <div class="stat"><div class="v">${s.costKm?(s.costKm*100).toFixed(2):'—'}</div><div class="l">${esc(state.settings.currency)} / 100 km</div></div>
    <div class="stat"><div class="v">${fmtMoney(s.totalCost)}</div><div class="l">Gasto total</div></div>
  </div>
  <p class="tiny" style="margin-bottom:12px">El consumo se calcula entre tanqueadas con tanque lleno. Marca "lleno" cada vez que llenes hasta arriba para obtener datos fiables. Referencia Gixxer 155 FI: entre 40 y 50 km por litro según uso; muy por debajo, revisa presión de llantas, filtro de aire y bujía.</p>`;
  if(!list.length)h+='<div class="empty"><div class="big">⛽</div>Sin tanqueadas todavía.</div>';
  else h+=`<div class="tablewrap"><table><tr><th>Fecha</th><th class="num">Km</th><th class="num">Litros</th><th class="num">Coste</th><th></th></tr>${list.map(x=>`<tr style="cursor:pointer" onclick="addFuel('${x.id}')"><td>${fmtD(x.date)}</td><td class="num">${fmtKm(x.km)}</td><td class="num">${Number(x.liters).toFixed(2)}</td><td class="num">${fmtMoney(x.cost)}</td><td>${x.full?'<span class="badge blue">lleno</span>':''}</td></tr>`).join('')}</table></div>`;
  el.innerHTML=h;
}
function addFuel(editId){
  const f=editId?state.fuel.find(x=>x.id===editId):null;
  openModal(f?'Editar tanqueada':'Nueva tanqueada',`
    <div class="frow"><label>Fecha<input name="date" type="date" required value="${f?f.date:today()}"></label><label>Kilómetros<input name="km" type="number" min="0" required value="${f?f.km:state.bike.km}"></label></div>
    <div class="frow"><label>Litros<input name="liters" type="number" min="0" step="0.01" required value="${f?.liters??''}"></label><label>Coste total (${esc(state.settings.currency)})<input name="cost" type="number" min="0" step="0.01" value="${f?.cost??''}"></label></div>
    <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="full" style="width:20px;height:20px;margin:0" ${!f||f.full?'checked':''}> Tanque lleno</label>`,
    d=>{const o={date:d.date,km:Number(d.km),liters:Number(d.liters),cost:Number(d.cost)||0,full:!!d.full};if(f)Object.assign(f,o);else state.fuel.push(Object.assign({id:uid()},o));if(o.km>Number(state.bike.km))state.bike.km=o.km;save();render();toast('Tanqueada guardada')},
    f?[{label:'Eliminar',cls:'danger',fn:()=>{state.fuel=state.fuel.filter(x=>x.id!==editId);save();closeModal();render()}}]:[]);
}

/* ==================== CHECKLIST ==================== */
function renderCheck(){
  const el=$('#p-check');
  if(state.checklist.date!==today()){state.checklist={date:today(),done:[]}}
  const done=state.checklist.done;const all=done.length===CHECKLIST.length;
  let h=`<h2>Checklist pre-ruta</h2><p class="muted" style="margin-bottom:12px">Revisión de 2 minutos antes de salir, basada en el método <b>T-CLOCS</b>. Se reinicia cada día.</p>
  ${all?'<div class="card ok"><b>✅ Todo revisado. ¡Buena ruta!</b></div>':''}
  ${CHECKLIST.map(c=>`<label class="check ${done.includes(c.id)?'done':''}"><input type="checkbox" ${done.includes(c.id)?'checked':''} onchange="toggleCheck('${c.id}',this.checked)"><div><b>${c.k} · ${esc(c.t)}</b><span>${esc(c.d)}</span></div></label>`).join('')}
  <div class="btnrow"><button class="btn" onclick="state.checklist.done=CHECKLIST.map(c=>c.id);save();render()">Marcar todo</button><button class="btn" onclick="state.checklist.done=[];save();render()">Reiniciar</button></div>
  <p class="tiny" style="margin-top:14px">¿Quieres saber qué mirar exactamente en cada punto? Lee la lección "Checklist T-CLOCS" en Aprender.</p>`;
  el.innerHTML=h;
}
function toggleCheck(id,on){const d=state.checklist.done;if(on&&!d.includes(id))d.push(id);if(!on)state.checklist.done=d.filter(x=>x!==id);save();render()}

{id:'gixxer',emoji:'🏍️',cat:'Mi Gixxer',title:'Conoce tu Gixxer 155 FI ABS',min:6,body:`
<p>La Gixxer 155 es una naked de 154,9 cc con un motor <b>monocilíndrico SOHC de 2 válvulas</b>, inyección electrónica y 5 velocidades. Es sencilla, fiable y barata de mantener si respetas tres cosas: aceite, cadena y llantas.</p>
<figure>${BIKE_MAP}<figcaption>Dónde está cada cosa en tu Gixxer (vista lateral derecha).</figcaption></figure>
<div class="legend" style="margin-bottom:12px">${BIKE_MAP_LEGEND.map(([n,t])=>`<span><i>${n}</i>${t}</span>`).join('')}</div>
<h4>Refrigeración por aire y aceite</h4>
<p>No tiene radiador de agua ni refrigerante. El motor se enfría con el aire que pasa por las aletas del cilindro y con un pequeño <b>radiador de aceite</b> (SOCS, Suzuki Oil Cooling System). Consecuencia: el aceite hace también de refrigerante, así que <b>el nivel y el cambio a tiempo son aún más importantes</b> que en una moto con agua. En trancones largos el motor se calienta más; evita mantenerla mucho tiempo en ralentí parada al sol.</p>
<h4>Motor SEP e inyección (FI)</h4>
<p>SEP (Suzuki Eco Performance) es el diseño del motor para gastar poco: espera entre 40 y 50 km por litro. La inyección electrónica se autorregula: no hay carburador que sincronizar ni ahogador que usar. Si el consumo sube o el ralentí se vuelve irregular, lo primero es filtro de aire, bujía y presión de llantas; luego, limpieza del cuerpo de aceleración en taller.</p>
<h4>Los frenos con ABS</h4>
<ul><li>El ABS evita que la rueda se bloquee en una frenada fuerte. Notarás una <b>vibración en la maneta</b> cuando actúa: es normal, no sueltes el freno.</li>
<li>El ABS no acorta la frenada por sí mismo; permite frenar fuerte sin caerte. Sigue frenando progresivo y con la moto recta.</li>
<li>Al encender la moto el testigo ABS se enciende y debe apagarse al superar unos 5-10 km/h. Si se queda encendido rodando, el ABS está desactivado (sensor sucio, batería baja): los frenos funcionan, pero sin ABS. Lleva a revisar.</li>
<li>Cambio de líquido de frenos (DOT 4) cada 2 años; con ABS, mejor purgar en taller con la herramienta adecuada.</li></ul>
<h4>Los números que te interesan</h4>
<ul><li><b>Aceite:</b> 10W-40 JASO MA2, aprox. 1,0 L (1,1 L con filtro). Nivel en la mirilla con la moto vertical.</li>
<li><b>Llantas:</b> 100/80-17 delante a 25 psi; 140/60R-17 detrás a 33 psi (36 con pasajero). Siempre en frío.</li>
<li><b>Cadena:</b> 20-30 mm de holgura.</li>
<li><b>Bujía:</b> NGK CPR8EA-9.</li>
<li><b>Tanque:</b> 12 L con 2,4 L de reserva. El testigo de reserva te da unos 80-100 km de margen.</li>
<li><b>Acelerador:</b> 2-4 mm de juego libre en el puño.</li></ul>
<h4>Plan de mantenimiento Suzuki</h4>
<p>Primer servicio a los <b>1.000 km</b> y después <b>cada 3.000 km o 6 meses</b>: aceite (y filtro según servicio), limpieza del filtro de aire, revisión de frenos, cadena, cables, llantas y tornillería. Cada 6.000 km, holgura de válvulas e inspección de bujía. A los 12.000 km, servicio mayor: filtro de aire nuevo, bujía nueva. Hacer los servicios en la red Suzuki mantiene la garantía; si lo haces por fuera, guarda facturas y apúntalo todo en Historial.</p>
<h4>Trámites en Colombia</h4>
<ul><li><b>SOAT:</b> anual y obligatorio siempre.</li>
<li><b>Revisión técnico-mecánica:</b> la primera al cumplir 2 años desde la matrícula (una moto de 2024 empieza en 2026) y luego cada año. Antes de ir: luces, pito, frenos, llantas, sin fugas y sin ruidos de escape.</li></ul>
<div class="note">Todos estos valores ya están cargados en el plan de mantenimiento y en la ficha técnica de esta app. En cada punto puedes guardar una foto de la pieza en tu propia moto (botón "¿Qué es?").</div>`,
quiz:[{q:'¿Cómo se refrigera el motor de la Gixxer 155?',o:['Con refrigerante y radiador de agua','Con aire y un radiador de aceite','Solo con agua','No necesita refrigeración'],a:1},{q:'¿Qué presión lleva la llanta trasera yendo solo?',o:['25 psi','29 psi','33 psi','40 psi'],a:2},{q:'Si el testigo ABS sigue encendido rodando...',o:['Los frenos no funcionan','Es normal, siempre está encendido','Los frenos funcionan pero sin ABS; hay que revisarlo','Hay que apagar la moto de inmediato'],a:2},{q:'¿Cuándo es la primera revisión técnico-mecánica de una moto matriculada en 2024?',o:['En 2025','En 2026','En 2027','Nunca'],a:1}]},

{id:'motor',emoji:'⚙️',cat:'Cómo funciona',title:'Cómo funciona un motor de 4 tiempos',min:5,body:`
<p>Casi todas las motos actuales llevan un motor de <b>cuatro tiempos</b>. Cada ciclo completo son dos vueltas de cigüeñal y cuatro fases:</p>
<ol><li><b>Admisión:</b> el pistón baja y entra aire y gasolina por la válvula de admisión.</li>
<li><b>Compresión:</b> el pistón sube con las válvulas cerradas y comprime la mezcla.</li>
<li><b>Explosión (o expansión):</b> la bujía enciende la mezcla y la presión empuja el pistón hacia abajo. Aquí se genera la fuerza.</li>
<li><b>Escape:</b> el pistón sube y expulsa los gases quemados por la válvula de escape.</li></ol>
<h4>Piezas que te interesa conocer</h4>
<figure>${ILLUS.plugs}<figcaption>La bujía: rosca abajo, cerámica blanca arriba, y el electrodo donde salta la chispa.</figcaption></figure>
<ul><li><b>Cilindro y pistón:</b> "monocilíndrica" o "bicilíndrica" indica cuántos hay. Los cc (centímetros cúbicos) son el volumen total de los cilindros.</li>
<li><b>Válvulas:</b> las abre el árbol de levas. Con el uso su holgura cambia y por eso se ajusta cada cierto kilometraje.</li>
<li><b>Bujía:</b> produce la chispa. Su color cuenta cómo está quemando el motor.</li>
<li><b>Embrague:</b> conecta o desconecta el motor de la caja de cambios. En la mayoría de motos va bañado en el aceite del motor (por eso el aceite debe ser JASO MA).</li></ul>
<h4>Refrigeración</h4>
<p><b>Por aire:</b> las aletas del cilindro disipan el calor; simple y sin mantenimiento. <b>Por líquido:</b> un radiador y una bomba mueven refrigerante; es más estable, pero hay que vigilar nivel y estado del líquido. <b>Tu Gixxer</b> es por aire con un radiador de aceite de apoyo: no lleva refrigerante.</p>
<div class="note">Un motor frío está más desprotegido: el aceite aún es espeso. Los primeros minutos, rueda suave sin subir mucho de vueltas.</div>`,
quiz:[{q:'¿En qué fase se genera la fuerza que mueve la moto?',o:['Admisión','Compresión','Explosión','Escape'],a:2},{q:'¿Por qué el aceite de moto suele necesitar la norma JASO MA?',o:['Porque el motor gira más rápido','Porque el embrague va bañado en el mismo aceite','Porque las motos no tienen filtro','Porque es más barato'],a:1}]},

{id:'aceite',emoji:'🛢️',cat:'Mantenimiento',title:'El aceite del motor: revisar y cambiar',min:5,body:`
<p>El aceite lubrica, refrigera, limpia y protege. Es el mantenimiento más importante y el más barato de hacer a tiempo.</p>
<h4>Cómo comprobar el nivel</h4>
<figure>${ILLUS.oil}<figcaption>La mirilla, en el lado derecho del motor: el aceite debe verse entre MIN y MAX.</figcaption></figure>
<ol><li>Calienta el motor unos minutos (o tras rodar) y apágalo.</li>
<li>Espera 2-3 minutos para que el aceite baje al cárter.</li>
<li>Pon la moto <b>completamente vertical</b>, nunca sobre el caballete lateral.</li>
<li>Mira la <b>mirilla</b> (ventanita en el motor) o la <b>varilla</b> (en algunas motos se apoya sin roscar; en otras se rosca. Lo dice el manual).</li>
<li>El nivel debe estar entre las marcas MIN y MAX. Si falta, añade poco a poco.</li></ol>
<h4>Qué aceite comprar</h4>
<ul><li><b>Viscosidad:</b> la Gixxer usa <b>10W-40</b>. El primer número es el comportamiento en frío (W = winter); el segundo, en caliente.</li>
<li><b>Norma JASO MA / MA2:</b> imprescindible si el embrague va en baño de aceite. Un aceite de coche puede hacer patinar el embrague.</li>
<li><b>Mineral, semisintético o sintético:</b> el sintético aguanta más y protege mejor. Para la Gixxer, un semisintético 10W-40 MA2 (Suzuki Ecstar, Motul 5100 o similar) es más que suficiente.</li>
<li><b>Cantidad:</b> aprox. 1,0 L en un cambio normal y 1,1 L si cambias el filtro. Rellena hasta la mitad de la mirilla, no hasta arriba.</li></ul>
<h4>Cuándo cambiarlo</h4>
<p>En la <b>Gixxer 155</b>, Suzuki indica <b>cada 3.000 km o 6 meses</b> (el primer cambio a los 1.000 km). Es un intervalo corto porque el aceite también refrigera el motor. El aceite se degrada además con el tiempo aunque no ruedes. Cambia el filtro cada uno o dos cambios y siempre la arandela del tapón de vaciado.</p>
<div class="warn">Aceite muy oscuro y con olor a quemado, o nivel que baja rápido: revísalo cuanto antes. Rodar sin aceite destruye el motor en minutos.</div>`,
quiz:[{q:'¿Cómo se comprueba correctamente el nivel de aceite?',o:['Con la moto en el caballete lateral y motor en marcha','Con la moto vertical, motor caliente apagado tras unos minutos','En frío y sobre el caballete lateral','Da igual la posición'],a:1},{q:'En "10W-40", el 10W indica...',o:['La calidad del aceite','El comportamiento en frío','El comportamiento en caliente','El precio'],a:1}]},

{id:'cadena',emoji:'⛓️',cat:'Mantenimiento',title:'La cadena: limpiar, lubricar y tensar',min:6,body:`
<p>La cadena transmite la fuerza del motor a la rueda trasera. Bien cuidada dura 20.000-30.000 km; descuidada, la mitad.</p>
<h4>Lubricar (cada 300-500 km, o tras lluvia)</h4>
<ol><li>Con la cadena caliente tras rodar y la moto en caballete central (o girando la rueda a mano con cuidado).</li>
<li>Aplica lubricante para cadena en la <b>parte interior</b> (la que toca la corona) mientras giras la rueda.</li>
<li>Deja reposar 10-15 minutos antes de rodar para que asiente y no salpique.</li></ol>
<h4>Limpiar (cada 1.000-2.000 km)</h4>
<p>Usa un limpiador específico de cadena o queroseno y un cepillo suave. Nunca uses disolventes agresivos ni una hidrolimpiadora a presión: dañan las juntas tóricas (retenes) de la cadena.</p>
<h4>Tensión</h4>
<figure>${ILLUS.chaintension}<figcaption>Holgura: lo que sube y baja la cadena en el centro del tramo inferior.</figcaption></figure>
<p>Mide la <b>holgura</b> en el punto medio del tramo inferior, moviendo la cadena arriba y abajo. En la <b>Gixxer 155 son 20-30 mm</b> con la moto sobre el caballete lateral (hay una pegatina en el basculante que lo recuerda).</p>
<ul><li><b>Muy floja:</b> golpea, salta y puede salirse.</li><li><b>Muy tensa:</b> es peor. Fuerza el rodamiento de la rueda y el eje de salida del motor.</li></ul>
<p>Gira la rueda y mide en varios puntos: si la holgura varía mucho, la cadena tiene tramos estirados y toca cambiarla.</p>
<h4>Señales de que hay que cambiar el kit de arrastre</h4>
<figure>${ILLUS.chainkit}<figcaption>Izquierda: dientes sanos. Derecha: dientes en aleta de tiburón, sprocket gastado.</figcaption></figure>
<ul><li>Eslabones que quedan rígidos o "tiesos".</li><li>Dientes de la corona afilados, en forma de aleta de tiburón.</li><li>Puedes separar la cadena de la corona tirando en la parte trasera y ver medio diente.</li><li>Ya no queda recorrido en los tensores.</li></ul>
<div class="note">Se cambian cadena, piñón y corona <b>a la vez</b>. Poner cadena nueva sobre piñones gastados la destroza en pocos miles de km.</div>`,
quiz:[{q:'¿Qué es peor para la moto?',o:['Cadena ligeramente floja','Cadena demasiado tensa','Ambas son iguales','Ninguna importa'],a:1},{q:'¿Dónde se aplica el lubricante de cadena?',o:['En la parte exterior','En la parte interior, la que toca la corona','En el piñón','En la llanta'],a:1},{q:'¿Qué indica una corona con dientes en forma de aleta de tiburón?',o:['Que es nueva','Que está bien tensada','Que está gastada','Que le falta lubricante'],a:2}]},

{id:'neumaticos',emoji:'🛞',cat:'Mantenimiento',title:'Neumáticos: presión, desgaste y edad',min:5,body:`
<p>Dos parches del tamaño de una tarjeta de crédito son todo lo que te une al asfalto. Son la pieza de seguridad número uno.</p>
<h4>Presión (revisar cada 15 días)</h4>
<ul><li>Mide <b>en frío</b>, antes de rodar. Al rodar la presión sube.</li><li><b>Gixxer 155:</b> 25 psi delante y 33 psi detrás yendo solo; 36 psi detrás con pasajero.</li><li>Poca presión: la moto se siente pesada, gasta más y desgasta los flancos. Mucha: menos agarre y desgaste en el centro.</li></ul>
<h4>Desgaste</h4>
<figure>${ILLUS.tires}<figcaption>Los testigos TWI son resaltes dentro de las ranuras del dibujo.</figcaption></figure>
<ul><li>Busca los <b>testigos TWI</b> (pequeños resaltes dentro de las ranuras). Cuando el dibujo llega a ellos, el neumático está al límite.</li><li>Mínimo legal habitual: <b>1,6 mm</b> de profundidad. En lluvia, por debajo de 2-3 mm ya se nota mucho.</li><li>Desgaste solo en el centro (típico de mucha autopista) o desgaste "a escalones" también son motivo de cambio.</li></ul>
<h4>Edad</h4>
<p>En el flanco hay un código <b>DOT</b> con 4 cifras al final: semana y año de fabricación (por ejemplo 2223 = semana 22 de 2023). Con más de 5-6 años la goma endurece y pierde agarre aunque tenga dibujo.</p>
<h4>Neumáticos nuevos</h4>
<p>Los primeros 100-150 km, evita frenadas fuertes e inclinaciones grandes: la superficie tiene restos de desmoldeante y aún está lisa.</p>
<div class="warn">Un clavo o tornillo clavado: no lo saques en carretera. Rueda despacio hasta un taller o usa un kit de reparación provisional.</div>`,
quiz:[{q:'¿Cuándo se mide la presión?',o:['Después de rodar 20 km','En frío, antes de rodar','Con el motor en marcha','Solo en verano'],a:1},{q:'¿Qué significan las cifras 2223 en el código DOT?',o:['22 mm de ancho, 23 de alto','Semana 22 del año 2023','22 PSI delante, 23 detrás','Es el número de serie'],a:1}]},

{id:'frenos',emoji:'🛑',cat:'Mantenimiento',title:'Frenos: pastillas, discos y líquido',min:5,body:`
<h4>Pastillas</h4>
<figure>${ILLUS.pads}<figcaption>Pastillas vistas de lado: el material de fricción debe tener más de 2 mm.</figcaption></figure>
<p>Mira por el lateral de la pinza: el material de fricción debe tener al menos <b>2 mm</b>. Muchas pastillas llevan una ranura indicadora; si desaparece, toca cambiar. Un chirrido metálico constante puede ser el testigo de desgaste tocando el disco.</p>
<h4>Discos</h4>
<p>Cada disco lleva grabado su <b>espesor mínimo</b> (MIN TH). Un disco con un "escalón" en el borde o que hace vibrar la maneta al frenar (alabeado) hay que cambiarlo.</p>
<h4>Líquido de frenos</h4>
<figure>${ILLUS.brakefluid}<figcaption>Depósito del freno delantero en el manillar derecho, con marcas MIN y MAX.</figcaption></figure>
<ul><li>Es <b>higroscópico</b>: absorbe humedad del aire. Con agua dentro, hierve antes y el freno "desaparece" en bajadas largas.</li><li>Por eso se cambia por <b>tiempo</b>: cada 2 años, aunque hayas rodado poco.</li><li>Comprueba el nivel en el depósito de la maneta (entre MIN y MAX). Si baja, normalmente es porque las pastillas se han gastado, no por fuga. Pero revísalo.</li><li>Usa el tipo indicado en el tapón (normalmente <b>DOT 4</b>). No mezcles tipos.</li></ul>
<h4>Síntomas para actuar ya</h4>
<ul><li>Maneta esponjosa o que se va hasta el puño: aire en el circuito o pastillas acabadas.</li><li>La moto tira hacia un lado al frenar.</li><li>Ruido de roce continuo sin frenar: pinza agarrotada.</li></ul>
<div class="warn">El líquido de frenos ataca la pintura. Si cae, límpialo enseguida con agua.</div>`,
quiz:[{q:'¿Por qué se cambia el líquido de frenos por tiempo y no por km?',o:['Porque es caro','Porque absorbe humedad del aire','Porque se evapora','Porque lo dice el taller'],a:1},{q:'Maneta de freno esponjosa suele indicar...',o:['Pastillas nuevas','Aire en el circuito','Disco nuevo','Neumático desinflado'],a:1}]},

{id:'electrico',emoji:'🔋',cat:'Mantenimiento',title:'Batería y sistema eléctrico',min:4,body:`
<h4>La batería</h4>
<figure>${ILLUS.battery}<figcaption>Bajo el asiento. Mide el voltaje en los bornes con la moto apagada.</figcaption></figure>
<ul><li>Con un polímetro, mide en los bornes con la moto apagada: <b>12,6-12,8 V</b> = cargada; 12,4 V = al 75 %; menos de <b>12,2 V</b> = cárgala.</li><li>Con el motor a 3.000 rpm debería marcar <b>13,5-14,5 V</b>. Si no sube, falla el regulador o el alternador. Si pasa de 15 V, el regulador está estropeado y se cargará la batería.</li><li>Si la moto pasa semanas parada, usa un <b>cargador-mantenedor</b>. Las baterías que se descargan del todo pierden vida.</li><li>Limpia los bornes con un cepillo si ves polvo blanco o verdoso y comprueba que estén bien apretados.</li></ul>
<h4>Fusibles</h4>
<p>Están en una caja bajo el asiento o cerca de la batería. Si algo deja de funcionar de golpe (luz, claxon, arranque), mira primero los fusibles. Lleva repuestos del amperaje correcto: nunca pongas uno mayor.</p>
<h4>Luces</h4>
<p>Revisa cada semana faro, luz de freno con cada mando por separado, intermitentes y matrícula. Ten a mano una bombilla de repuesto si tu moto las usa halógenas.</p>
<div class="note">Arranca cuesta: si el motor de arranque gira lento y las luces bajan de intensidad, es la batería. Si hace clic pero no gira, suele ser batería muy baja o relé de arranque.</div>`,
quiz:[{q:'¿Qué voltaje tiene una batería de 12 V bien cargada en reposo?',o:['10 V','11,5 V','12,6-12,8 V','14,5 V'],a:2},{q:'Si un fusible salta, ¿qué haces?',o:['Poner uno de más amperios para que aguante','Puentearlo con un cable','Cambiarlo por otro del mismo amperaje y buscar la causa si vuelve a saltar','Ignorarlo'],a:2}]},

{id:'liquidos',emoji:'💧',cat:'Mantenimiento',title:'Refrigerante, filtro de aire y otros líquidos',min:4,body:`
<h4>Refrigerante (no aplica a la Gixxer)</h4>
<p class="muted">Tu Gixxer se refrigera por aire y aceite, así que puedes saltarte este apartado. Lo dejamos por si algún día tienes otra moto.</p>
<ul><li>Mira el nivel en el <b>vaso de expansión</b> (depósito translúcido) con el motor <b>frío</b> y la moto vertical. Debe estar entre MIN y MAX.</li><li>Nunca abras el tapón del radiador en caliente: sale a presión y quema.</li><li>Rellena con el mismo tipo de anticongelante (color/base). En emergencia vale agua destilada, pero cambia después.</li><li>Se sustituye cada <b>2 años</b> porque pierde sus aditivos anticorrosión.</li><li>Si el ventilador se activa a menudo en ciudad es normal. Si la temperatura sube en carretera o ves fugas verdes/rosas, revisa.</li></ul>
<h4>Filtro de aire</h4>
<p>Impide que entre polvo al motor. Sucio, la moto pierde potencia y gasta más. Los de <b>papel</b> se sustituyen; los de <b>espuma</b> se lavan, secan y se impregnan de aceite específico. Si ruedas por tierra, revísalo cada pocos cientos de km.</p>
<h4>Aceite de horquilla y retenes</h4>
<p>Si ves una línea de aceite en las barras de la horquilla o gotas en la parte inferior, los retenes están dañados. Además de perder amortiguación, el aceite puede llegar al disco de freno delantero.</p>
<h4>Cables y mandos</h4>
<p>Lubrica los cables de embrague y acelerador si van duros. El puño del acelerador debe tener 2-3 mm de juego libre y volver solo.</p>`,
quiz:[{q:'¿Cuándo se comprueba el nivel de refrigerante?',o:['Con el motor caliente','Con el motor frío, en el vaso de expansión','Abriendo el radiador tras rodar','No hace falta'],a:1},{q:'Una línea de aceite en las barras de la horquilla indica...',o:['Que le sobra aceite','Retenes dañados','Que está bien lubricada','Nada importante'],a:1}]},

{id:'tclocs',emoji:'✅',cat:'Seguridad',title:'Checklist T-CLOCS antes de salir',min:4,body:`
<p>Es el método de la Motorcycle Safety Foundation para revisar la moto en 2 minutos. Cada letra es un grupo de cosas que mirar:</p>
<ul><li><b>T – Tires & wheels (neumáticos y ruedas):</b> presión, dibujo, cortes, objetos clavados. Radios flojos o llantas golpeadas.</li>
<li><b>C – Controls (controles):</b> manetas, puños, cables, acelerador que vuelve solo, pedales de freno y cambio.</li>
<li><b>L – Lights (luces y eléctrico):</b> faro, luz de freno con cada mando, intermitentes, claxon, batería.</li>
<li><b>O – Oil & fluids (aceite y líquidos):</b> niveles de aceite, refrigerante, líquido de frenos. Sin manchas bajo la moto.</li>
<li><b>C – Chassis (chasis):</b> cadena tensada y lubricada, suspensión sin fugas, tornillería a la vista.</li>
<li><b>S – Stands (caballetes):</b> se retraen bien y los muelles los mantienen recogidos.</li></ul>
<p>No hace falta hacer toda la lista al detalle cada día. Lo diario: <b>neumáticos a ojo, luces, frenos y una mirada bajo la moto</b>. Lo semanal: presión, cadena y niveles.</p>
<div class="note">La pestaña Checklist de esta app te guía por estos puntos y se reinicia cada día.</div>`,
quiz:[{q:'¿Qué representa la "O" en T-CLOCS?',o:['Ojos','Aceite y líquidos','Óptica','Orden'],a:1}]},

{id:'conduccion',emoji:'🛣️',cat:'Seguridad',title:'Conducción segura: frenar, mirar y trazar',min:6,body:`
<h4>La mirada</h4>
<p>La moto va a donde miras. En una curva, mira la salida, no el borde de la carretera ni el obstáculo. Mantén la mirada lejos y amplia.</p>
<h4>Frenar</h4>
<ul><li>Alrededor del <b>70 % de la frenada</b> la hace el freno delantero. Úsalo siempre, pero con progresividad: primero suave, luego más fuerte a medida que la horquilla se comprime.</li><li>Frena <b>con la moto recta</b>. En curva, el neumático no puede frenar e inclinar a la vez.</li><li>Practica frenadas de emergencia en un sitio seguro para saber cómo responde tu moto (y su ABS, si lo tiene).</li></ul>
<h4>Curvas</h4>
<ol><li><b>Reduce antes</b> de entrar: velocidad y marcha adecuadas.</li><li><b>Mira</b> la salida.</li><li><b>Inclina</b> con el contramanillar: empuja suavemente el puño del lado hacia el que quieres girar.</li><li><b>Acelera suave</b> desde el vértice hacia la salida: estabiliza la moto.</li></ol>
<h4>Lluvia y frío</h4>
<ul><li>Todo más suave: frenos, gas, inclinación. Los primeros minutos de lluvia son los peores (el aceite del asfalto flota).</li><li>Evita pintura, tapas de alcantarilla y hojas: son hielo.</li><li>Los neumáticos fríos agarran mucho menos. Dales unos km.</li></ul>
<h4>Tráfico</h4>
<ul><li>Asume que no te ven. Colócate donde el conductor te vea por el retrovisor, nunca en su punto ciego.</li><li>Mantén distancia: 2 segundos como mínimo, más en lluvia.</li><li>En cruces, cubre el freno (dos dedos sobre la maneta) para ganar tiempo de reacción.</li></ul>
<h4>Equipación</h4>
<p>Casco homologado bien ajustado, guantes siempre, chaqueta con protecciones y calzado que cubra el tobillo. La mayoría de caídas urbanas ocurren a menos de 50 km/h, y las manos son lo primero que toca el suelo.</p>`,
quiz:[{q:'¿Cuándo se frena en una curva?',o:['En el vértice','Antes de entrar, con la moto recta','A la salida','Nunca'],a:1},{q:'¿Qué freno aporta más capacidad de frenada?',o:['El trasero','El delantero','Los dos por igual','El motor'],a:1},{q:'Para inclinar la moto a la derecha con el contramanillar...',o:['Tiras del puño derecho','Empujas el puño derecho','Empujas el puño izquierdo','Te inclinas sin tocar el manillar'],a:1}]},

{id:'manual',emoji:'📘',cat:'Cómo funciona',title:'Cómo leer el manual y la tabla de mantenimiento',min:3,body:`
<p>El manual del propietario es la fuente de verdad para tu moto concreta. Lo que más te interesa:</p>
<ul><li><b>Tabla de mantenimiento periódico:</b> una tabla con filas (aceite, bujías, válvulas, etc.) y columnas por kilometraje (1.000, 6.000, 12.000...). Marca I = inspeccionar, R = reemplazar, L = lubricar. Copia estos intervalos en la pestaña Mantenimiento de esta app.</li>
<li><b>Especificaciones:</b> tipo y cantidad de aceite, viscosidad, presión de neumáticos, holgura de cadena, tipo de bujía, líquido de frenos, capacidad del depósito.</li>
<li><b>Pares de apriete:</b> si vas a aflojar tornillos importantes (ejes, pinzas de freno, tapón de aceite), aprieta al par indicado con una llave dinamométrica.</li>
<li><b>Ubicación de fusibles, mirilla, tornillos de tensado.</b></li></ul>
<h4>Si no tienes el manual</h4>
<p>Busca "[marca modelo año] owner's manual pdf" o "manual de usuario". Muchos fabricantes los publican gratis. El manual de taller (service manual) es más completo y explica cada procedimiento paso a paso.</p>
<h4>Cuando vayas al taller</h4>
<ul><li>Di los km y qué notas (ruidos, vibraciones, cuándo aparecen).</li><li>Pide que anoten en la factura qué se ha hecho y a qué km. Apúntalo en Historial.</li><li>Pregunta qué toca en la próxima revisión.</li></ul>
<div class="note">Un historial de mantenimiento completo sube el valor de la moto cuando la vendas.</div>`,
quiz:[{q:'En una tabla de mantenimiento, la letra "I" suele significar...',o:['Ignorar','Inspeccionar','Instalar','Importante'],a:1}]},

{id:'kit',emoji:'🧰',cat:'Seguridad',title:'Qué llevar siempre en la moto',min:3,body:`
<ul><li><b>Documentación:</b> licencia de conducción, tarjeta de propiedad, SOAT vigente y, cuando aplique, certificado de la técnico-mecánica.</li>
<li><b>Manómetro de bolsillo:</b> pequeño y barato; el de la gasolinera suele estar descalibrado.</li>
<li><b>Kit de reparación de pinchazos</b> con mechas o espray, y un mini compresor o cartuchos de CO2. Un pinchazo en el trasero es de lo más común.</li>
<li><b>Herramientas básicas:</b> el kit de la moto más una llave para el eje trasero, llaves Allen y Torx, alicates, cinta americana, bridas.</li>
<li><b>Fusibles de repuesto</b> y, si lleva halógenas, una bombilla.</li>
<li><b>Cables de arranque finos</b> o un arrancador de litio compacto.</li>
<li><b>Chaleco reflectante</b> y guantes de látex para trabajar con cadena o aceite.</li>
<li><b>Candado de disco</b> y un candado de cadena si aparcas en la calle.</li></ul>
<h4>Antes de un viaje largo</h4>
<p>Cadena limpia y tensada, presión, revisión del nivel de aceite y de las pastillas, luces. Si estás a menos de 500 km de un cambio de aceite, hazlo antes de salir. Con 12 L de tanque tienes unos 450-500 km de autonomía; no apures la reserva en carretera.</p>`,
quiz:[{q:'¿Por qué llevar tu propio manómetro?',o:['Porque es obligatorio','Porque los de gasolinera suelen estar descalibrados','Para inflar','Para tensar la cadena'],a:1}]},

{id:'parada',emoji:'🧊',cat:'Mantenimiento',title:'Invierno y paradas largas',min:3,body:`
<p>Si vas a dejar la moto parada más de un mes:</p>
<ol><li><b>Depósito lleno</b> y, si puedes, con estabilizador de gasolina. Un depósito vacío se oxida por dentro y la gasolina vieja atasca inyectores y carburadores.</li>
<li><b>Batería:</b> conéctala a un mantenedor, o desconéctala y cárgala una vez al mes.</li>
<li><b>Neumáticos:</b> presión al máximo recomendado y, si es posible, moto sobre caballete central para no deformarlos.</li>
<li><b>Cadena limpia y lubricada</b>; una capa de lubricante protege del óxido.</li>
<li><b>Lavar y secar</b> antes de guardar. Cera o protector sobre metales expuestos.</li>
<li><b>Funda transpirable</b> en interior. Evita plásticos que condensen humedad.</li></ol>
<h4>Al volver a rodar</h4>
<p>Presión de neumáticos, frenos (pueden estar pegados por el óxido del disco), luces, nivel de aceite. Arranca y deja calentar. Frena varias veces suave para limpiar los discos.</p>
<div class="note">Arrancar la moto 5 minutos cada semana sin rodar es peor que no arrancarla: no llega a temperatura y genera condensación en el aceite y el escape.</div>`,
quiz:[{q:'Antes de una parada larga, el depósito debe estar...',o:['Vacío','Lleno','A la mitad','Da igual'],a:1}]},

{id:'glosario',emoji:'📖',cat:'Glosario',title:'Glosario motero',min:4,body:`
<ul>
<li><b>ABS:</b> sistema que evita que la rueda se bloquee al frenar.</li>
<li><b>Basculante:</b> brazo que une la rueda trasera al chasis y permite que la suspensión trabaje.</li>
<li><b>Caballete central / lateral:</b> soportes para aparcar. El central deja la rueda trasera en el aire (ideal para la cadena).</li>
<li><b>Cárter:</b> parte inferior del motor donde se acumula el aceite.</li>
<li><b>Corona y piñón:</b> ruedas dentadas de la transmisión (trasera y del motor). Con la cadena forman el kit de arrastre.</li>
<li><b>Culata:</b> parte superior del motor donde están las válvulas y la bujía.</li>
<li><b>DOT (líquido):</b> clasificación del líquido de frenos (DOT 3, 4, 5.1). En el flanco del neumático, indica su fecha de fabricación.</li>
<li><b>Embrague en baño de aceite:</b> discos del embrague sumergidos en el aceite del motor.</li>
<li><b>Horquilla:</b> suspensión delantera. "Invertida" cuando la parte gruesa va arriba.</li>
<li><b>Juntas tóricas (O-ring, X-ring):</b> pequeños retenes de goma en la cadena que retienen la grasa interna.</li>
<li><b>Mirilla:</b> ventana en el motor para ver el nivel de aceite.</li>
<li><b>Par de apriete:</b> fuerza con la que se aprieta un tornillo, en Nm. Se mide con llave dinamométrica.</li>
<li><b>Pinza de freno:</b> pieza que aloja las pastillas y aprieta el disco.</li>
<li><b>Purgar frenos:</b> sacar el aire del circuito hidráulico.</li>
<li><b>Regulador-rectificador:</b> convierte la corriente del alternador para cargar la batería.</li>
<li><b>Retén:</b> junta que evita fugas de aceite (horquilla, motor).</li>
<li><b>Rodaje:</b> primeros 500-1.000 km de un motor nuevo, con uso suave.</li>
<li><b>TWI:</b> Tread Wear Indicator, testigo de desgaste del neumático.</li>
<li><b>Vaso de expansión:</b> depósito del refrigerante donde se mira el nivel.</li>
</ul>`,
quiz:[{q:'¿Qué es el kit de arrastre?',o:['Los frenos','Cadena, piñón y corona','La suspensión','El embrague'],a:1}]}
];

let learnCat='all',openLesson=null,quizState=null;
function renderLearn(){
  const el=$('#p-learn');
  if(openLesson){return renderLesson(el)}
  const cats=['all',...new Set(LESSONS.map(l=>l.cat))];
  const list=LESSONS.filter(l=>learnCat==='all'||l.cat===learnCat);
  const done=state.learn.read.length;
  el.innerHTML=`<h2>Aprender</h2><p class="muted" style="margin-bottom:10px">Lecciones cortas para entender tu moto y cuidarla tú mismo. Cada una termina con un mini test.</p>
  <div class="bar"><i style="width:${Math.round(done/LESSONS.length*100)}%"></i></div><div class="tiny" style="margin:4px 0 12px">${done} de ${LESSONS.length} lecciones leídas</div>
  <div class="tabs">${cats.map(c=>`<button class="${learnCat===c?'active':''}" onclick="learnCat='${c}';render()">${c==='all'?'Todas':esc(c)}</button>`).join('')}</div>
  <div class="grid">${list.map(l=>{const read=state.learn.read.includes(l.id);const q=state.learn.quiz[l.id];return `<div class="card lesson ${read?'read':''}" onclick="openLesson='${l.id}';quizState=null;render()"><div class="thumb">${l.emoji||'📄'}</div><div style="flex:1;min-width:0"><div class="row"><b>${esc(l.title)}</b>${read?'<span class="badge ok">✓</span>':''}</div><div class="muted">${esc(l.cat)} · ${l.min} min${q?` · test ${q.score}/${q.total}`:''}</div></div></div>`}).join('')}</div>`;
}
function renderLesson(el){
  const l=LESSONS.find(x=>x.id===openLesson);
  const read=state.learn.read.includes(l.id);
  let quiz='';
  if(l.quiz&&l.quiz.length){
    if(!quizState)quiz=`<div class="card"><b>🧠 Mini test (${l.quiz.length} pregunta${l.quiz.length>1?'s':''})</b><div class="btnrow"><button class="btn primary" onclick="quizState={i:0,score:0,answered:null};render()">Empezar</button></div></div>`;
    else if(quizState.i>=l.quiz.length){quiz=`<div class="card ok"><b>Resultado: ${quizState.score}/${l.quiz.length}</b><p class="muted">${quizState.score===l.quiz.length?'¡Perfecto!':'Repasa la lección y vuelve a intentarlo cuando quieras.'}</p><div class="btnrow"><button class="btn" onclick="quizState={i:0,score:0,answered:null};render()">Repetir</button></div></div>`}
    else{const q=l.quiz[quizState.i];quiz=`<div class="card quiz"><div class="tiny">Pregunta ${quizState.i+1} de ${l.quiz.length}</div><b style="display:block;margin:6px 0 10px">${esc(q.q)}</b>${q.o.map((o,i)=>`<button type="button" class="opt ${quizState.answered!==null?(i===q.a?'right':(i===quizState.answered?'wrong':'')):''}" ${quizState.answered!==null?'disabled':''} onclick="answer(${i})">${esc(o)}</button>`).join('')}${quizState.answered!==null?`<div class="btnrow"><button class="btn primary" onclick="quizState.i++;quizState.answered=null;render()">${quizState.i+1<l.quiz.length?'Siguiente':'Ver resultado'}</button></div>`:''}</div>`}
  }
  el.innerHTML=`<button class="btn link" onclick="openLesson=null;render()">← Todas las lecciones</button>
  <h2 style="margin-top:8px">${esc(l.title)}</h2><div class="muted" style="margin-bottom:8px">${esc(l.cat)} · ${l.min} min de lectura</div>
  <div class="card lessonbody">${l.body}</div>
  ${quiz}
  <div class="btnrow">${read?'<span class="badge ok">✓ Marcada como leída</span>':`<button class="btn primary" onclick="markRead('${l.id}')">Marcar como leída</button>`}</div>`;
}
function answer(i){const l=LESSONS.find(x=>x.id===openLesson);const q=l.quiz[quizState.i];quizState.answered=i;if(i===q.a)quizState.score++;if(quizState.i+1>=l.quiz.length){const prev=state.learn.quiz[l.id];if(!prev||quizState.score>=prev.score)state.learn.quiz[l.id]={score:quizState.score,total:l.quiz.length};save()}render()}
function markRead(id){if(!state.learn.read.includes(id))state.learn.read.push(id);save();render();toast('Lección completada')}

/* ==================== AJUSTES ==================== */
function renderSettings(){
  const el=$('#p-settings');const b=state.bike;
  el.innerHTML=`<h2>Ajustes</h2>
  <div class="card"><div class="row"><div><b>${esc(b.name||'Mi moto')}</b><div class="muted">${esc([b.brand,b.model,b.year].filter(Boolean).join(' '))||'Sin datos'}${b.plate?' · '+esc(b.plate):''}</div><div class="muted">${fmtKm(b.km)}</div>${b.notes?`<div class="tiny">${esc(b.notes)}</div>`:''}</div><button class="btn sm" onclick="editBike()">Editar</button></div>
  ${photos.bike?`<img class="bikephoto" style="margin-top:12px" src="${photos.bike}" alt="Mi Gixxer">`:''}
  <div class="btnrow"><button class="btn sm" onclick="pickPhoto('bike',render)">📷 ${photos.bike?'Otra foto':'Tomar foto de mi moto'}</button><button class="btn sm" onclick="pickPhoto('bike',render,true)">🖼️ Elegir de la galería</button>${photos.bike?`<button class="btn sm danger" onclick="removePhoto('bike',render)">Quitar foto</button>`:''}</div>
  <p class="tiny" style="margin-top:8px">Las fotos se guardan en este dispositivo y se incluyen en la copia de seguridad exportada. ¿Imágenes libres de derechos de la Gixxer? Busca "Suzuki Gixxer" en Wikimedia Commons u Openverse, descarga la que quieras y súbela con "Elegir de la galería".</p></div>
  <h3>Ficha técnica · Suzuki Gixxer 155 FI ABS 2024</h3>
  <div class="card"><div class="tablewrap"><table>
    <tr><th>Motor</th><td>${esc(BIKE.engine)}</td></tr>
    <tr><th>Refrigeración</th><td>${esc(BIKE.cooling)}</td></tr>
    <tr><th>Aceite</th><td>${esc(BIKE.oil)}<br><span class="muted">${esc(BIKE.oilQty)}</span></td></tr>
    <tr><th>Bujía</th><td>${esc(BIKE.plug)}</td></tr>
    <tr><th>Llanta delantera</th><td>${esc(BIKE.tireF)}</td></tr>
    <tr><th>Llanta trasera</th><td>${esc(BIKE.tireR)}</td></tr>
    <tr><th>Cadena</th><td>${esc(BIKE.chain)}</td></tr>
    <tr><th>Frenos</th><td>${esc(BIKE.brakes)}</td></tr>
    <tr><th>Acelerador</th><td>${esc(BIKE.throttle)}</td></tr>
    <tr><th>Tanque</th><td>${esc(BIKE.tank)}</td></tr>
    <tr><th>Batería</th><td>${esc(BIKE.battery)}</td></tr>
    <tr><th>Peso / asiento</th><td>${esc(BIKE.weight)}</td></tr>
    <tr><th>Servicio</th><td>${esc(BIKE.service)}</td></tr>
  </table></div><p class="tiny" style="margin-top:8px">Valores del manual del propietario y de Suzuki Colombia. Si tu manual indica otro dato, manda el manual.</p></div>
  <h3>Datos</h3>
  <div class="card"><p class="muted">Tus datos se guardan solo en este dispositivo. Exporta una copia de seguridad de vez en cuando (o antes de cambiar de móvil).</p>
  <div class="btnrow"><button class="btn" onclick="exportData()">⬇️ Exportar copia</button><label class="btn" style="display:inline-block;margin:0">⬆️ Importar copia<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label><button class="btn" onclick="copyData()">📋 Copiar al portapapeles</button></div><p class="tiny" style="margin-top:6px">La copia al portapapeles no incluye las fotos (pesan demasiado); la exportación sí.</p>
  <div class="btnrow"><button class="btn sm danger" onclick="resetItems()">Restaurar plan de mantenimiento por defecto</button><button class="btn sm danger" onclick="resetAll()">Borrar todo</button></div></div>
  <h3>Preferencias</h3>
  <div class="card"><label>Moneda <span class="tiny">($ = pesos colombianos, sin decimales)</span><input value="${esc(state.settings.currency)}" maxlength="4" onchange="state.settings.currency=this.value||'$';save();render()"></label></div>
  <h3>Instalar como app</h3>
  <div class="card"><p class="muted"><b>Android (Chrome):</b> menú ⋮ → "Añadir a pantalla de inicio" o "Instalar aplicación".<br><b>iPhone (Safari):</b> botón compartir → "Añadir a pantalla de inicio".</p><p class="tiny" style="margin-top:6px">Una vez instalada funciona sin conexión y se abre como cualquier otra app.</p>
  <div class="btnrow" id="installRow"></div></div>
  <p class="tiny" style="margin-top:14px">MotoLog v4 · Gixxer 155 FI ABS 2024 · Los consejos son orientativos y no sustituyen el manual del fabricante ni a un mecánico.</p>`;
  if(deferredInstall){$('#installRow').innerHTML='<button class="btn primary" onclick="doInstall()">Instalar MotoLog</button>'}
}
function editBike(){
  const b=state.bike;
  openModal('Mi moto',`
    <label>Nombre (apodo)<input name="name" value="${esc(b.name)}" placeholder="Ej. Mi Gixxer"></label>
    <div class="frow"><label>Marca<input name="brand" value="${esc(b.brand)}" placeholder="Honda, Yamaha..."></label><label>Modelo<input name="model" value="${esc(b.model)}" placeholder="CB500F"></label></div>
    <div class="frow"><label>Año<input name="year" type="number" min="1900" max="2100" value="${esc(b.year)}"></label><label>Placa<input name="plate" value="${esc(b.plate)}" placeholder="ABC12D"></label></div>
    <label>Kilómetros actuales<input name="km" type="number" min="0" required value="${b.km}"></label>
    <label>Notas <span class="tiny">(aceite que usa, presiones, referencias...)</span><textarea name="notes">${esc(b.notes)}</textarea></label>`,
    d=>{Object.assign(state.bike,{name:d.name.trim(),brand:d.brand.trim(),model:d.model.trim(),year:d.year,plate:d.plate.trim(),km:Number(d.km)||0,notes:d.notes.trim()});save();render();toast('Moto guardada')});
}
function exportData(){
  const blob=new Blob([JSON.stringify(Object.assign({},state,{photos}),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`motolog-${today()}.json`;document.body.appendChild(a);a.click();a.remove();
}
function copyData(){navigator.clipboard?.writeText(JSON.stringify(state)).then(()=>toast('Copiado')).catch(()=>toast('No se pudo copiar'))}
function importData(input){
  const f=input.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const s=JSON.parse(r.result);if(!s||s.v!==1||!Array.isArray(s.items))throw 0;if(confirm('Esto reemplazará los datos actuales. ¿Continuar?')){const ph=s.photos&&typeof s.photos==='object'?s.photos:null;delete s.photos;localStorage.setItem(KEY,JSON.stringify(s));state=load();(async()=>{if(ph){for(const k of Object.keys(photos))await setPhoto(k,null);for(const [k,v] of Object.entries(ph))if(typeof v==='string'&&v.startsWith('data:image/'))await setPhoto(k,v)}render();toast('Datos importados')})()}}catch(e){toast('Archivo no válido')}input.value=''};
  r.readAsText(f);
}
function resetItems(){if(confirm('Se restaurarán los puntos e intervalos por defecto. El historial se conserva. ¿Continuar?')){const custom=state.items.filter(i=>!DEFAULT_ITEMS.some(d=>d.id===i.id));state.items=[...JSON.parse(JSON.stringify(DEFAULT_ITEMS)),...custom];save();render();toast('Plan restaurado')}}
function resetAll(){if(confirm('¿Borrar TODOS los datos? Esta acción no se puede deshacer.')&&confirm('¿Seguro? Exporta una copia antes si tienes dudas.')){localStorage.removeItem(KEY);state=freshState();save();(async()=>{for(const k of Object.keys(photos))await setPhoto(k,null);go('home')})()}}

/* ==================== MODAL ==================== */
let modalCb=null;
function openModal(title,body,onSave,extra=[]){
  modalCb=onSave;$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;
  const btns=$('#modalBtns');btns.innerHTML=`<button type="submit" class="btn primary">Guardar</button><button type="button" class="btn" onclick="closeModal()">Cancelar</button>`;
  extra.forEach(b=>{const x=document.createElement('button');x.type='button';x.className='btn '+(b.cls||'');x.textContent=b.label;x.onclick=b.fn;btns.appendChild(x)});
  $('#modalbg').classList.add('open');
  const first=$('#modalBody').querySelector('input:not([type=date]):not([type=checkbox]),select,textarea');if(first&&window.innerWidth>600)first.focus();
}
function openSheet(title,body,extra=[]){
  modalCb=null;$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;
  const btns=$('#modalBtns');btns.innerHTML=`<button type="button" class="btn" onclick="closeModal()">Cerrar</button>`;
  extra.forEach(b=>{const x=document.createElement('button');x.type='button';x.className='btn '+(b.cls||'');x.textContent=b.label;x.onclick=b.fn;btns.insertBefore(x,btns.firstChild)});
  $('#modalbg').classList.add('open');
}
function closeModal(){$('#modalbg').classList.remove('open');modalCb=null}
function submitModal(e){e.preventDefault();const d={};new FormData(e.target).forEach((v,k)=>d[k]=v);e.target.querySelectorAll('input[type=checkbox]').forEach(c=>d[c.name]=c.checked);if(modalCb&&modalCb(d)!==false)closeModal();return false}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ==================== PWA ==================== */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(current==='settings')render()});
function doInstall(){if(!deferredInstall)return;deferredInstall.prompt();deferredInstall.userChoice.then(()=>{deferredInstall=null;render()})}
/*SW*/if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

/* ==================== ARRANQUE ==================== */
const initial=(location.hash||'').slice(1);
go(['home','maint','history','fuel','check','learn','settings'].includes(initial)?initial:'home');
loadPhotos().then(()=>{if(Object.keys(photos).length)render()});
</script>
